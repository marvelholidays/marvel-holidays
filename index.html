<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description -->
    <title>MARVEL Holidays | Explore the World</title>
    <meta
      name="description"
      content="Discover unforgettable domestic and international holidays with MARVEL Holidays. Plan your next adventure with us."
    />
    <meta name="keywords" content="Marvel Holidays, travel agency, holiday packages, tour packages, visa assistance, flight bookings" />

    <!-- Favicon (Place logo.png inside your project's public/ folder) -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph Meta Tags (For WhatsApp / Social Media Link Previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marvelholidays.in/" />
    <meta property="og:title" content="MARVEL Holidays | Explore the World" />
    <meta property="og:description" content="Discover unforgettable domestic and international holidays with MARVEL Holidays. Plan your next adventure with us." />
    <meta property="og:image" content="https://marvelholidays.in/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MARVEL Holidays | Explore the World" />
    <meta name="twitter:description" content="Discover unforgettable domestic and international holidays with MARVEL Holidays." />
    <meta name="twitter:image" content="https://marvelholidays.in/logo.png" />
  </head>
